<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<body>
    <div id="aurora-bg"></div>

    <main class="container">
        <header>
            <h1 id="Author">Your Name</h1>
            <p class="subline">Developer & Designer</p>
        </header>

        <section class="grid">
            <div class="spotlight-card">
                <div class="card-content">
                    <span class="card-tag brown">Project 01</span>
                    <h3>Project Name</h3>
                    <p>Brief description of work.</p>
                </div>
            </div>
            <div class="spotlight-card">
                <div class="card-content">
                    <span class="card-tag">Experience</span>
                    <h3>Role at Company</h3>
                    <p>What you built and shipped.</p>
                </div>
            </div>
            <div class="spotlight-card">
                <div class="card-content">
                    <span class="card-tag brown">Skills</span>
                    <h3>Tech Stack</h3>
                    <p>Languages, tools, frameworks.</p>
                </div>
            </div>
            <div class="spotlight-card">
                <div class="card-content">
                    <span class="card-tag">Contact</span>
                    <h3>Get in Touch</h3>
                    <p>Email or socials.</p>
                </div>
            </div>
        </section>

        <section class="projects">
            <h2 class="section-label">Projects</h2>
            <div id="projects-menu"></div>
        </section>
